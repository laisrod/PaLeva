services:
  - type: web
    name: paleva-backend
    env: ruby
    buildCommand: |
      bundle install
      echo "Build completed"
    # This service is configured manually in the Render dashboard (not synced
    # as a Blueprint), so the Start Command below is kept in sync by hand with
    # Settings > Deploy > Start Command. db:seed intentionally does not run
    # here - it's a manual, one-off step via the Render Shell:
    #   bin/rails db:seed RAILS_ENV=production
    startCommand: bundle exec rails db:migrate RAILS_ENV=production && bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      # DATABASE_URL is set manually in the dashboard (external Neon Postgres),
      # not provisioned through this file - see Environment tab.
      - key: DATABASE_URL
        sync: false
    plan: free
